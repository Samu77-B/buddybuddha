      text-align: center;

</head>

  // ── Utility ────────────────────────────────────────────────────────────────
  function getDayOfYear(date) {
    const start = new Date(date.getFullYear(), 0, 0);
    return Math.floor((date - start) / 86400000);
  }

  function formatDate(doy) {
    const d = new Date(new Date().getFullYear(), 0, doy);
    return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function getQuote(day) {
    const idx = ((day - 1) % quotes.length + quotes.length) % quotes.length;
    return quotes[idx];
  }

  // ── State ──────────────────────────────────────────────────────────────────
  const todayDOY = getDayOfYear(new Date());
  let currentDay = todayDOY;

  // ── Render ─────────────────────────────────────────────────────────────────
  function render(day) {
    const q = getQuote(day);
    document.getElementById('quote-text').textContent = q.q;
    document.getElementById('quote-attr').textContent = '- ' + q.a;
    document.getElementById('day-pill').textContent = 'Day ' + day + ' of 365 · ' + formatDate(day);
    document.getElementById('btn-prev').style.opacity = day <= 1 ? '0.35' : '1';
    document.getElementById('btn-next').style.opacity = day >= 365 ? '0.35' : '1';
  }

  // ── Controls ───────────────────────────────────────────────────────────────
  function changeDay(delta) {
    const next = currentDay + delta;
    if (next >= 1 && next <= 365) {
      currentDay = next;
      render(currentDay);
    }
  }

  function goToday() {
    currentDay = todayDOY;
    render(currentDay);
  }

  function setTab(el, tab) {
    document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    // TODO: add tab-switching logic here
  }

  function shareQuote() {
    const q = getQuote(currentDay);
    const text = '"' + q.q + '" — ' + q.a;
    if (navigator.share) {
      navigator.share({ title: 'Buddy Buddha', text });
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => alert('Quote copied to clipboard!'));
    }
  }

  // ── Live clock ─────────────────────────────────────────────────────────────
  function updateClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('clock').textContent = h + ':' + m;
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ── Init ───────────────────────────────────────────────────────────────────
  render(currentDay);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
